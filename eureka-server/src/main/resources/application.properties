spring.application.name=eureka-server
server.port=8761

# Eureka Server configuration
eureka.instance.hostname=eureka-server
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.client.service-url.defaultZone=http://${eureka.instance.hostname}:${server.port}/eureka/
eureka.server.enable-self-preservation=true
eureka.server.renewal-percent-threshold=0.49
eureka.server.eviction-interval-timer-in-ms=60000

# Disable config client import check
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Logging
logging.level.com.netflix.eureka.cluster.PeerEurekaNodes=ERROR
logging.level.com.netflix.eureka.resources.InstanceResource=ERROR
logging.level.com.netflix.eureka.registry.AbstractInstanceRegistry=INFO