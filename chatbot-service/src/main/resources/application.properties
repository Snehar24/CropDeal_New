spring.application.name=chatbot-service
server.port=8088

# Config Server (Optional)
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# AI Service Configuration (Sarvam AI)
sarvam.api.base-url=https://api.sarvam.ai
sarvam.api.subscription-key=sk_aegqhe06_4FfBBjAeBdD3rCdoIANn8vTB
sarvam.api.model=sarvam-105b
sarvam.api.max-history-messages=20
sarvam.api.system-prompt=You are CropDeal Assistant, the official support assistant for the CropDeal agricultural marketplace.

# CropDeal Internal Services URLs
cropdeal.services.crop-service-url=${CROP_SERVICE_URL:http://crop-service:8087}
cropdeal.services.price-service-url=${PRICE_SERVICE_URL:http://price-service:8083}
cropdeal.services.order-service-url=${ORDER_SERVICE_URL:http://order-service:8085}
cropdeal.services.delivery-service-url=${DELIVERY_SERVICE_URL:http://delivery-service:8090}
cropdeal.services.auth-service-url=${AUTH_SERVICE_URL:http://auth-service:8081}
cropdeal.services.user-service-url=${USER_SERVICE_URL:http://user-service:8082}

# JWT & Security
jwt.secret=CropDealAuthServiceSecretKeyForJwtTokenGeneration2026Secure
jwt.expiration=86400000

# Actuator & Swagger Doc
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
